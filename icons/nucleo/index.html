<head>

  <title>Nucleo Micro Bold Essential</title>
  <style>
    :root { color-scheme: light dark; --bg:#0f1115; --fg:#e8eaed; --muted:#9aa0a6; --card:#1a1d24; }
    @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --fg:#111; --muted:#5f6368; --card:#fff; } }
    body { margin:0; font:14px/1.4 ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:24px; border-bottom:1px solid color-mix(in oklab, var(--fg) 12%, transparent); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:12px; padding:24px; }
    figure { margin:0; background:var(--card); border-radius:10px; padding:14px 8px 10px; text-align:center; border:1px solid color-mix(in oklab, var(--fg) 8%, transparent); color:var(--fg); }
    img { width:20px; height:20px; object-fit:contain; display:block; margin:0 auto 8px; }
    figcaption { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  </style>
</head>
